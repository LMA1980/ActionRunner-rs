[package]
name = "action-runner"
version = "0.2.0"
edition = "2021"
description = "Lightweight zero-copy distributed CI execution worker agent for ActionRunner"
license = "AGPL-3.0-only"
repository = "https://github.com/LMA1980/ActionRunner-rs"

[dependencies]
action-runner-ipc = { git = "https://github.com/LMA1980/ActionRunner-ipc.git", branch = "feat/worker-shutdown-signal" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "fs", "io-util", "signal"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
fory = "1.7"
arrow = { version = "54", default-features = false, features = ["ipc"] }
thiserror = "1"
