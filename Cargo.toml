[package]
name = "action-runner"
version = "0.1.0"
edition = "2021"
description = "Lightweight GitHub Webhook & CI runner sidecar for SpacemiT K3 RISC-V platform"
license = "Apache-2.0"
repository = "https://github.com/LMA1980/ActionRunner-rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
