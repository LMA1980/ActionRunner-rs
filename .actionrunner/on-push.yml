version: "2"
name: "ActionRunner-rs Distributed Pipeline: Formatting, Clippy, Security & K3 Verification"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: audit-check
    name: "Verify Security Advisories"
    tags: ["audit"]
    threads: 2
    run: "cargo audit"

  - id: native-k3
    name: "Validate Native K3 Verification & Tests"
    tags: ["k3"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 6
    run: "cargo test"
