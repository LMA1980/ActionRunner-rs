version: "1"
name: "ActionRunner-rs Pull Request Verification Pipeline"

env:
  CARGO_TERM_COLOR: always

steps:
  - name: "Verify Rust Formatting (cargo fmt)"
    run: "cargo fmt --check"
    timeout_seconds: 120

  - name: "Verify Rust Linter & Clippy Rules (cargo clippy)"
    run: "cargo clippy --all-targets -- -D warnings"
    timeout_seconds: 300

  - name: "Verify Dependencies Security Advisories (cargo audit)"
    run: "cargo audit"
    timeout_seconds: 180

  - name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    run: "cargo llvm-cov --summary-only"
    timeout_seconds: 300

  - name: "Validate Native Release Compilation"
    run: "cargo build --release"
    timeout_seconds: 600
