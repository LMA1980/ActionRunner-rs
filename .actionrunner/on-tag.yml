version: "2"
name: "ActionRunner-rs Release Pipeline: Production Binary Verification"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: coverage-test
    name: "Evaluate Test Suite & Line Code Coverage (cargo llvm-cov)"
    tags: ["test"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 4
    run: "cargo llvm-cov --summary-only"

  - id: release-build
    name: "Build Production Optimized Binary"
    tags: ["build"]
    depends_on: ["fmt-check", "clippy-check"]
    threads: 4
    run: "cargo build --release"
