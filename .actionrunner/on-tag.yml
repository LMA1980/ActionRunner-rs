version: "2"
name: "ActionRunner-rs Release Pipeline: Production Binary Verification"

stages:
  - id: fmt-check
    name: "Verify Rust Formatting"
    tags: ["fmt"]
    threads: 2
    run: "cargo fmt --check"

  - id: clippy-check
    name: "Verify Rust Linter & Clippy Rules"
    tags: ["clippy"]
    depends_on: ["fmt-check"]
    threads: 4
    run: "cargo clippy --all-targets -- -D warnings"

  - id: audit-check
    name: "Verify Security Advisories"
    tags: ["audit"]
    depends_on: ["fmt-check"]
    threads: 2
    run: "cargo generate-lockfile && cargo audit"

  - id: native-k3
    name: "Validate Native K3 Release Compilation & Line Coverage"
    tags: ["k3"]
    depends_on: ["clippy-check", "audit-check"]
    threads: 6
    run: "cargo llvm-cov --summary-only && cargo build --release"
