# /etc/systemd/system/nginx.service.d/override.conf
#
# Production Hardening Drop-in for Nginx Reverse Proxy on SpacemiT Key Stone K3
# Implements CGroup v2 resource envelopes and Linux namespace sandboxing.

[Service]
# ==============================================================================
# 1. CGroup v2 Resource Boundaries
# ==============================================================================
# Nginx is lean (< 50MB RAM typical). On a 16-core recognized topology, 200%
# allocates up to 2 cores for Nginx, preventing HTTP floods / Slowloris from
# starving the native CI builder or taking down the host.
MemoryMax=512M
MemoryHigh=384M
CPUQuota=200%
TasksMax=256

# ==============================================================================
# 2. Kernel & Namespace Sandboxing
# ==============================================================================
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictRealtime=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

# ==============================================================================
# 3. Filesystem Sandboxing (Principle of Least Privilege)
# ==============================================================================
# Read-only access to web assets, configs, certificates, and logging:
ReadOnlyPaths=/var/lib/action-runner/web/dist /var/www /etc/nginx /etc/letsencrypt
ReadWritePaths=/var/log/nginx /var/cache/nginx /run

# Completely shield CI workspaces, git repositories, webhook secrets, and developer files.
# Even in the event of an Nginx RCE / 0-day, the web server cannot read these paths:
InaccessiblePaths=/home /root /var/lib/action-runner/workspace /etc/action-runner /etc/shadow
